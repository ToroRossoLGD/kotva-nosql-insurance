name: Deploy public demo

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kotva-production-deploy
  cancel-in-progress: false

jobs:
  source:
    name: Require main branch
    runs-on: ubuntu-latest
    steps:
      - name: Reject non-main deployments
        env:
          DEPLOY_REF: ${{ github.ref }}
        run: test "$DEPLOY_REF" = refs/heads/main

  verify:
    name: Run CI before deployment
    needs: source
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Back up and deploy VPS
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: https://demo.kotva2.com
    steps:
      - name: Check out deployment script
        uses: actions/checkout@v4

      - name: Validate SSH configuration
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"

      - name: Prepare SSH credentials
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/kotva-ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/kotva-ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/kotva-ssh/known_hosts"

      - name: Back up, deploy and verify
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          ssh -i "$RUNNER_TEMP/kotva-ssh/id_ed25519" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/kotva-ssh/known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -eu; script=\$(mktemp /tmp/kotva-deploy.XXXXXXXX); trap 'rm -f \"\$script\"' EXIT; cat > \"\$script\"; bash \"\$script\" '$GITHUB_SHA'" \
            < ops/deploy.sh

      - name: Verify the VPS reached the requested commit
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          deployed_sha=$(ssh -i "$RUNNER_TEMP/kotva-ssh/id_ed25519" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/kotva-ssh/known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" 'git -C /opt/kotva rev-parse HEAD')
          if [[ "$deployed_sha" != "$GITHUB_SHA" ]]; then
            echo "VPS commit $deployed_sha does not match requested commit $GITHUB_SHA" >&2
            exit 1
          fi
