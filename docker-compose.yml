services:
  arangodb:
    image: arangodb:3.12
    container_name: kotva-arangodb
    environment:
      ARANGO_ROOT_PASSWORD: ${ARANGO_PASSWORD:-kotva123}
    ports: ["127.0.0.1:8529:8529"]
    volumes: ["arango_data:/var/lib/arangodb3"]
    healthcheck:
      test: ["CMD-SHELL", "arangosh --server.endpoint tcp://127.0.0.1:8529 --server.username root --server.password \"$$ARANGO_ROOT_PASSWORD\" --javascript.execute-string \"db._version()\" >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
  warehouse:
    image: postgres:16-alpine
    container_name: kotva-warehouse
    environment:
      POSTGRES_DB: kotva_warehouse
      POSTGRES_USER: kotva
      POSTGRES_PASSWORD: ${WAREHOUSE_PASSWORD:-kotva_warehouse123}
    ports: ["127.0.0.1:${WAREHOUSE_PORT:-5433}:5432"]
    volumes: ["warehouse_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build: .
    container_name: kotva-app
    environment:
      PORT: 3000
      USE_ARANGO: "true"
      ARANGO_URL: http://arangodb:8529
      ARANGO_DB: kotva
      ARANGO_USER: root
      ARANGO_PASSWORD: ${ARANGO_PASSWORD:-kotva123}
      JWT_SECRET: ${JWT_SECRET:-kotva-local-demo-secret-change-before-production}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123!}
      AGENT_PASSWORD: ${AGENT_PASSWORD:-Agent123!}
      ANALYST_PASSWORD: ${ANALYST_PASSWORD:-Analyst123!}
      ADRIA_ADMIN_PASSWORD: ${ADRIA_ADMIN_PASSWORD:-Adria123!}
      UPLOAD_DIR: /app/uploads
      WAREHOUSE_URL: postgresql://kotva:${WAREHOUSE_PASSWORD:-kotva_warehouse123}@warehouse:5432/kotva_warehouse
    ports: ["127.0.0.1:${APP_PORT:-3001}:3000"]
    volumes: ["document_uploads:/app/uploads"]
    depends_on:
      arangodb: {condition: service_healthy}
      warehouse: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    stop_grace_period: 15s
volumes:
  arango_data:
  document_uploads:
  warehouse_data:
